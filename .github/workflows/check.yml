name: Check

# Builds and vets every package for every target on the toolchain that can build it, on every pull request and push to main even before the first release, so a change that leaves main unable to build cannot merge. Apple targets run on macOS because their SDKs are supplied by Xcode; the other targets run on Linux. It runs no tests: test.yml does, when dispatched (AGENTS.md).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    name: Build and vet (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and vet non-Apple targets
        run: go tool nsgo check -target windows_arm64,windows_x64,linux_arm64,linux_x64,android_arm64,web

  apple:
    name: Build and vet (Apple)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and vet Apple targets
        run: go tool nsgo check -target macos_arm64,macos_x64,ios,ios_simulator,tvos,tvos_simulator,watchos,watchos_simulator
