name: Test

# Vets and tests every package on Linux under a virtual display, and Apple's shared code and macOS backend on macOS. release.yml calls it before publishing a release.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor libgtk-4-dev libgtk-4-media-gstreamer libwebkitgtk-6.0-4 libsoup-3.0-0 xvfb pulseaudio gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio
      - name: Allow WebKit's sandbox on the runner
        run: |
          # Ubuntu restricts unprivileged user namespaces. Grant bubblewrap that permission so WebKit can keep its sandbox enabled.
          sudo tee /etc/apparmor.d/nsgo-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile nsgo-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/nsgo-ci-bwrap
          bwrap --unshare-user --unshare-net --ro-bind / / /usr/bin/true
      - name: Start a virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=nsgo_test
          pactl set-default-sink nsgo_test
      - name: Vet
        run: go tool nsgo check
      - name: Test native modified presses
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test -target linux -run '^TestPressModifiersReachTheApp$' ./examples/gallery
      - name: Test
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          PULSE_SINK: nsgo_test
        run: xvfb-run -a go tool nsgo test

  apple:
    # Use the Intel pool while hosted arm64 capacity leaves jobs unallocated.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go tool nsgo check ./internal/platform/apple
      - name: Test
        run: go tool nsgo test ./internal/platform/apple
      - name: Test main-thread failure propagation
        run: go tool nsgo test -run '^TestOnMainExitPropagation$' ./internal/platform/macos -- -race
      - name: Test macOS backend
        run: go tool nsgo test ./internal/platform/macos
      - name: Test native input isolation
        run: go tool nsgo test -target macos ./testdata/inputisolation
      - name: Stress Objective-C blocks under GC and the race detector
        env:
          GOGC: "1"
        run: go tool nsgo test ./internal/platform/objcblock -- -race
      - name: Stress window observers in fresh processes
        env:
          GOGC: "1"
        run: go tool nsgo test -run '^TestWindowObserversSurviveGC$' ./internal/platform/macos -- -race -timeout=180s
      - name: Test native modified presses
        run: go tool nsgo test -target macos -run '^TestPressModifiersReachTheApp$' ./examples/gallery

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test native modified presses
        run: go tool nsgo test -target windows -run '^TestPressModifiersReachTheApp$' ./examples/gallery
