name: Test

# Vets and tests every package on Linux under a virtual display, and Apple's shared platform code on macOS. release.yml calls it before publishing a release.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: test-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgtk-4-media-gstreamer libwebkitgtk-6.0-4 libsoup-3.0-0 xvfb pulseaudio gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio
      - name: Start a virtual audio output
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=nsgo_test
          pactl set-default-sink nsgo_test
      - name: Vet
        run: go tool nsgo check
      - name: Test
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          PULSE_SINK: nsgo_test
        run: xvfb-run -a go tool nsgo test

  apple:
    # Use the Intel pool while hosted arm64 capacity leaves jobs unallocated.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go tool nsgo check ./internal/platform/apple
      - name: Test
        run: go tool nsgo test ./internal/platform/apple
