name: File associations

# Installs isolated test registrations; keep manual until the first release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install desktop registration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shared-mime-info libglib2.0-bin
      - name: Check
        run: go tool nsgo check ./cmd/nsgo
      - name: Verify packages and GIO registration
        env:
          NSGO_FILE_ASSOCIATIONS: '1'
        run: go tool nsgo test -run 'FileAssociations|FileTypes|NSIS|LinuxPackages|FlatpakManifest|AppDirEntries' ./cmd/nsgo

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install NSIS
        run: choco install nsis --yes --no-progress
      - name: Check
        run: go tool nsgo check ./cmd/nsgo
      - name: Verify install, Shell opening, upgrade and uninstall
        env:
          NSGO_FILE_ASSOCIATIONS: '1'
        run: go tool nsgo test -run 'FileAssociations|FileTypes|NSIS|LinuxPackages|FlatpakManifest|AppDirEntries' ./cmd/nsgo
